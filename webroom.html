<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KILLIAN · DYNAMIC LOBBY · MULTI VIDEO</title>
    <!-- Font Awesome, CryptoJS, PeerJS, MQTT -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
    <style>
        /* ----- SAME COSMIC BASE, EXTENDED FOR LOBBY & FLIP CARDS ----- */
        :root {
            --primary: #0c0e1b;
            --secondary: #1a1d36;
            --accent: #6a4ce0;
            --accent2: #ff4d94;
            --accent3: #00e0ff;
            --text: #e0e0ff;
            --text-secondary: #a0a0c0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(106, 76, 224, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(255, 77, 148, 0.15) 0%, transparent 40%);
            z-index: -1;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration, 5s) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .lobby-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(106, 76, 224, 0.4);
            flex-wrap: wrap;
            gap: 15px;
        }

        .lobby-title {
            font-size: clamp(1.5rem, 7vw, 2.2rem);
            background: linear-gradient(to right, var(--accent3), var(--accent2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .room-badge {
            background: rgba(0,0,0,0.4);
            padding: 8px 18px;
            border-radius: 40px;
            border: 1px solid var(--accent);
            font-family: monospace;
            font-size: 1rem;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .online-counter {
            background: var(--accent);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.9rem;
            color: white;
        }

        /* Main layout: video area + user strip */
        .video-main {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }

        .video-panel {
            flex: 2;
            min-width: 300px;
            background: var(--secondary);
            border-radius: 28px;
            padding: 15px;
            border: 1px solid rgba(106, 76, 224, 0.3);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .video-header-label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            color: var(--accent3);
        }

        .video-box {
            position: relative;
            width: 100%;
            background: #0b0e1a;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .video-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #05070f;
        }

        #localVideo { transform: scaleX(-1); }
        .remote-video video { transform: scaleX(1); }

        .video-placeholder {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0c0f1c;
            color: var(--text-secondary);
        }

        .control-bar {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .btn {
            background: rgba(20,25,50,0.8);
            border: 1px solid var(--accent);
            color: white;
            padding: 10px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(45deg, var(--accent), var(--accent2));
            border: none;
        }
        .btn-danger { background: rgba(255,60,100,0.2); border-color: #ff4d6d; }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { opacity: 0.4; pointer-events: none; }

        /* User strip (scrolling thumbnails) */
        .user-strip {
            background: var(--secondary);
            border-radius: 28px;
            padding: 18px 12px;
            border: 1px solid rgba(106, 76, 224, 0.3);
            margin-top: 10px;
        }

        .strip-title {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            color: var(--accent3);
        }

        .thumbnails-container {
            display: flex;
            gap: 18px;
            overflow-x: auto;
            padding: 10px 5px 15px;
            scrollbar-width: thin;
            scrollbar-color: var(--accent) #1a1d36;
        }

        /* Flip card thumbnail */
        .flip-card {
            background: transparent;
            width: 120px;
            height: 140px;
            perspective: 1000px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .flip-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.5s;
            transform-style: preserve-3d;
            border-radius: 24px;
        }

        .flip-card.flipped .flip-inner {
            transform: rotateY(180deg);
        }

        .flip-front, .flip-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 24px;
            padding: 12px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            border: 2px solid transparent;
            background-clip: padding-box;
        }

        .flip-front {
            background: linear-gradient(145deg, #1e2340, #12172e);
            transform: rotateY(0deg);
        }

        .flip-back {
            background: #0f1322;
            transform: rotateY(180deg);
            color: var(--text);
            font-size: 0.75rem;
            overflow-y: auto;
            justify-content: flex-start;
            text-align: left;
        }

        /* Dynamic gradient border effect */
        .user-thumb {
            position: relative;
            border-radius: 24px;
        }

        .user-thumb::before {
            content: '';
            position: absolute;
            top: -3px; left: -3px; right: -3px; bottom: -3px;
            border-radius: 27px;
            background: linear-gradient(45deg, var(--grad-start, #6a4ce0), var(--grad-end, #ff4d94));
            z-index: -1;
            animation: borderGlow 4s infinite alternate;
        }

        @keyframes borderGlow {
            0% { filter: hue-rotate(0deg); opacity: 0.8; }
            100% { filter: hue-rotate(40deg); opacity: 1; }
        }

        .thumb-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: var(--grad-start, #6a4ce0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
            margin-bottom: 8px;
            border: 2px solid white;
        }

        .thumb-name {
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100px;
        }

        .thumb-status {
            font-size: 0.7rem;
            color: #00e0ff;
        }

        .flip-back p {
            margin: 6px 0;
            border-bottom: 1px solid #2a2f4a;
            padding-bottom: 4px;
        }

        .notification {
            position: fixed;
            top: 20px; right: 20px;
            background: rgba(10,15,35,0.95);
            border-radius: 16px;
            padding: 15px 22px;
            border-left: 5px solid var(--accent3);
            transform: translateX(120%);
            transition: 0.3s;
            z-index: 2000;
            backdrop-filter: blur(10px);
        }
        .notification.show { transform: translateX(0); }
        .notification-close {
            position: absolute; top: 8px; right: 14px;
            background: none; border: none; color: #a0a0ff; font-size: 1.3rem; cursor: pointer;
        }

        @media (max-width: 700px) {
            .video-main { flex-direction: column; }
            .flip-card { width: 100px; height: 130px; }
        }
    </style>
</head>
<body>
<div class="stars" id="stars-container"></div>
<div class="notification" id="notification">
    <button class="notification-close" id="notification-close">×</button>
    <h4 id="notification-title">Notification</h4>
    <p id="notification-message"></p>
</div>

<div class="container">
    <!-- Header -->
    <div class="lobby-header">
        <div class="lobby-title">
            <i class="fas fa-users-between-lines"></i>
            <span>KILLIAN · DYNAMIC LOBBY</span>
        </div>
        <div class="room-badge">
            <i class="fas fa-door-open"></i>
            <span id="room-id-display">lobby-xxxx</span>
            <span class="online-counter" id="online-count">0 online</span>
        </div>
    </div>

    <!-- Video + Thumbnails -->
    <div class="video-main">
        <div class="video-panel">
            <div class="video-header-label">
                <i class="fas fa-user-astronaut"></i> YOU · <span id="active-call-status">No active call</span>
            </div>
            <div class="video-box" id="local-box">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="video-placeholder" id="local-placeholder"><i class="fas fa-camera"></i> camera off</div>
            </div>
            <div class="video-box remote-video" style="margin-top:15px;">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-placeholder" id="remote-placeholder"><i class="fas fa-user-secret"></i> select a contact</div>
            </div>
            <div class="control-bar">
                <button class="btn" id="toggle-mic-btn"><i class="fas fa-microphone"></i> Mute</button>
                <button class="btn" id="toggle-video-btn"><i class="fas fa-video-slash"></i> Video off</button>
                <button class="btn" id="switch-camera-btn"><i class="fas fa-sync-alt"></i> Switch</button>
                <button class="btn btn-danger" id="hangup-btn" disabled><i class="fas fa-phone-slash"></i> End call</button>
            </div>
        </div>
    </div>

    <!-- User thumbnails strip -->
    <div class="user-strip">
        <div class="strip-title">
            <span><i class="fas fa-user-group"></i> CONNECTED USERS · tap to call / flip for info</span>
            <span id="refresh-users" style="cursor:pointer;"><i class="fas fa-arrows-rotate"></i></span>
        </div>
        <div class="thumbnails-container" id="thumbnails-container">
            <!-- dynamic flip cards injected here -->
        </div>
    </div>
    <div style="margin-top:8px; text-align:right; font-size:0.8rem; opacity:0.6;">
        <i class="fas fa-shield"></i> P2P encrypted · MQTT presence · dynamic gradient borders
    </div>
</div>

<script>
    (function(){
        "use strict";
        // ---------- STARS ----------
        function createStars() {
            const stars = document.getElementById('stars-container');
            for (let i=0; i<160; i++) {
                const s = document.createElement('div'); s.classList.add('star');
                s.style.left = Math.random()*100+'%'; s.style.top = Math.random()*100+'%';
                s.style.width = s.style.height = Math.random()*3+1+'px';
                s.style.opacity = Math.random()*0.7+0.2;
                s.style.setProperty('--duration', Math.random()*4+3+'s');
                stars.appendChild(s);
            }
        }
        createStars();

        // ---------- NOTIFICATION ----------
        const notif = document.getElementById('notification');
        const notifTitle = document.getElementById('notification-title');
        const notifMsg = document.getElementById('notification-message');
        function showNotif(title, msg, good=true) {
            notifTitle.textContent = title; notifMsg.textContent = msg;
            notif.style.borderLeftColor = good ? 'var(--accent3)' : '#ff4d6d';
            notif.classList.add('show');
            setTimeout(() => notif.classList.remove('show'), 4000);
        }
        document.getElementById('notification-close').onclick = ()=> notif.classList.remove('show');

        // ---------- GLOBAL STATE ----------
        let localStream = null;
        let peer = null;
        let currentCall = null;
        let peerId = '';
        let roomName = '';
        let mqttClient = null;
        let usersMap = new Map(); // peerId -> { info, gradient, location }
        let myLocationInfo = {};
        let isMuted = false, isVideoOff = false, usingFront = true;

        // DOM elements
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const localPlaceholder = document.getElementById('local-placeholder');
        const remotePlaceholder = document.getElementById('remote-placeholder');
        const activeCallStatus = document.getElementById('active-call-status');
        const hangupBtn = document.getElementById('hangup-btn');
        const toggleMicBtn = document.getElementById('toggle-mic-btn');
        const toggleVideoBtn = document.getElementById('toggle-video-btn');
        const switchCameraBtn = document.getElementById('switch-camera-btn');
        const thumbContainer = document.getElementById('thumbnails-container');
        const onlineCountSpan = document.getElementById('online-count');
        const roomIdDisplay = document.getElementById('room-id-display');

        // Room ID from URL or generate
        function getRoomFromUrl() {
            const params = new URLSearchParams(window.location.search);
            let room = params.get('room');
            if (!room) {
                room = 'lobby-' + Math.random().toString(36).substring(2,8);
                const url = new URL(window.location);
                url.searchParams.set('room', room);
                window.history.replaceState({}, '', url);
            }
            return room;
        }
        roomName = getRoomFromUrl();
        roomIdDisplay.textContent = roomName;
        const MQTT_TOPIC = `killian/lobby/${roomName}`;

        // ---------- IP GEOLOCATION ----------
        async function fetchLocationInfo() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                myLocationInfo = {
                    country: data.country_name || 'Unknown',
                    city: data.city || 'Unknown',
                    region: data.region || '',
                    zip: data.postal || '',
                    lat: data.latitude, lon: data.longitude,
                    ip: data.ip
                };
            } catch(e) { myLocationInfo = { country:'?', city:'?' }; }
        }

        // ---------- Generate unique gradient per user ----------
        function generateGradient(seed) {
            let hash = 0;
            for (let i=0; i<seed.length; i++) hash = ((hash<<5)-hash)+seed.charCodeAt(i);
            const h1 = Math.abs(hash % 360);
            const h2 = (h1 + 40) % 360;
            return { start: `hsl(${h1}, 80%, 60%)`, end: `hsl(${h2}, 85%, 55%)` };
        }

        // ---------- Render thumbnails from usersMap ----------
        function renderThumbnails() {
            const container = thumbContainer;
            container.innerHTML = '';
            const sorted = Array.from(usersMap.entries()).filter(([id])=> id !== peerId);
            onlineCountSpan.textContent = `${sorted.length + 1} online`;
            
            sorted.forEach(([id, userData]) => {
                const grad = userData.gradient;
                const info = userData.info;
                const loc = userData.location || {};
                const card = document.createElement('div');
                card.className = 'flip-card user-thumb';
                card.dataset.peerId = id;
                card.style.setProperty('--grad-start', grad.start);
                card.style.setProperty('--grad-end', grad.end);
                
                const initials = (info.name || id.substring(0,2)).substring(0,2).toUpperCase();
                const displayName = info.name || id.substring(0,6)+'...';
                
                card.innerHTML = `
                    <div class="flip-inner">
                        <div class="flip-front">
                            <div class="thumb-avatar" style="background:${grad.start};">${initials}</div>
                            <div class="thumb-name">${displayName}</div>
                            <div class="thumb-status"><i class="fas fa-circle" style="color:#00ff99; font-size:8px;"></i> online</div>
                        </div>
                        <div class="flip-back">
                            <p><i class="fas fa-globe"></i> ${loc.country || '?'}, ${loc.city || '?'}</p>
                            <p><i class="fas fa-map-pin"></i> ${loc.region || ''} ${loc.zip || ''}</p>
                            <p><i class="fas fa-network-wired"></i> ${loc.ip || '—'}</p>
                            <p><i class="fas fa-id-card"></i> ${id.substring(0,10)}…</p>
                        </div>
                    </div>
                `;
                
                card.addEventListener('click', (e) => {
                    // Toggle flip if clicking on back? but we want call on front click.
                    if (!card.classList.contains('flipped')) {
                        // initiate call
                        callUser(id);
                    } else {
                        card.classList.remove('flipped');
                    }
                });
                // double-tap / long press for flip (simulate)
                card.addEventListener('dblclick', (e) => {
                    e.stopPropagation();
                    card.classList.toggle('flipped');
                });
                // Also flip on right-click?
                card.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    card.classList.toggle('flipped');
                });
                
                container.appendChild(card);
            });
            
            if (sorted.length === 0) {
                container.innerHTML = '<div style="padding:20px; color:var(--text-secondary);"><i class="fas fa-user-slash"></i> Waiting for others...</div>';
            }
        }

        // ---------- MQTT presence ----------
        function setupMQTT() {
            const broker = 'wss://broker.emqx.io:8084/mqtt';
            mqttClient = mqtt.connect(broker, { clientId: 'killian_' + Math.random().toString(16) });
            
            mqttClient.on('connect', () => {
                showNotif('Lobby connected', `Room: ${roomName}`);
                mqttClient.subscribe(MQTT_TOPIC, (err) => { if(!err) publishPresence(); });
                // request existing users
                publishPresence();
            });
            
            mqttClient.on('message', (topic, message) => {
                try {
                    const data = JSON.parse(message.toString());
                    if (data.peerId === peerId) return;
                    if (data.type === 'presence') {
                        usersMap.set(data.peerId, {
                            info: data.info,
                            gradient: data.gradient,
                            location: data.location,
                            timestamp: Date.now()
                        });
                    } else if (data.type === 'leave') {
                        usersMap.delete(data.peerId);
                    }
                    renderThumbnails();
                } catch(e) {}
            });
            
            setInterval(() => {
                // cleanup stale (20s)
                const now = Date.now();
                for (let [id, val] of usersMap) if (now - val.timestamp > 25000) usersMap.delete(id);
                renderThumbnails();
            }, 8000);
        }

        function publishPresence() {
            if (!mqttClient || !peerId) return;
            const grad = generateGradient(peerId);
            const payload = {
                type: 'presence',
                peerId: peerId,
                info: { name: `User-${peerId.substring(0,4)}` },
                gradient: grad,
                location: myLocationInfo,
                timestamp: Date.now()
            };
            mqttClient.publish(MQTT_TOPIC, JSON.stringify(payload));
        }

        // ---------- PeerJS & media ----------
        async function initLocalMedia() {
            try {
                const constraints = { video: !isVideoOff ? { width:1280, height:720, facingMode: usingFront?'user':'environment' } : false, audio: !isMuted };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                if (localStream) localStream.getTracks().forEach(t=>t.stop());
                localStream = stream;
                localVideo.srcObject = stream;
                localPlaceholder.style.display = 'none';
                updateButtons();
                if (currentCall) replaceTracks();
            } catch(e) { showNotif('Camera/Mic error', e.message, false); }
        }

        function updateButtons() {
            toggleMicBtn.innerHTML = isMuted ? '<i class="fas fa-microphone-slash"></i> Unmute' : '<i class="fas fa-microphone"></i> Mute';
            toggleVideoBtn.innerHTML = isVideoOff ? '<i class="fas fa-video"></i> Video on' : '<i class="fas fa-video-slash"></i> Video off';
        }

        function replaceTracks() {
            if (!currentCall) return;
            const senders = currentCall.peerConnection.getSenders();
            const vTrack = localStream?.getVideoTracks()[0];
            const aTrack = localStream?.getAudioTracks()[0];
            senders.forEach(s => { if(s.track?.kind==='video' && vTrack) s.replaceTrack(vTrack); if(s.track?.kind==='audio'&&aTrack) s.replaceTrack(aTrack); });
        }

        function initPeer() {
            peer = new Peer(undefined, { host:'0.peerjs.com', port:443, secure:true, debug:0 });
            peer.on('open', async (id) => {
                peerId = id;
                await fetchLocationInfo();
                await initLocalMedia();
                setupMQTT();
                publishPresence();
                setInterval(publishPresence, 12000);
            });
            peer.on('call', async (call) => {
                if (!localStream) await initLocalMedia();
                call.answer(localStream);
                setupCallHandlers(call);
                activeCallStatus.textContent = `in call with ${call.peer.substring(0,6)}`;
            });
            peer.on('error', e => showNotif('Peer error', e.type, false));
        }

        function setupCallHandlers(call) {
            if (currentCall) { currentCall.close(); }
            currentCall = call;
            hangupBtn.disabled = false;
            call.on('stream', remoteStream => {
                remoteVideo.srcObject = remoteStream;
                remotePlaceholder.style.display = 'none';
            });
            call.on('close', cleanupCall);
            call.on('error', cleanupCall);
        }

        function cleanupCall() {
            if (remoteVideo.srcObject) { remoteVideo.srcObject.getTracks().forEach(t=>t.stop()); remoteVideo.srcObject=null; }
            remotePlaceholder.style.display = 'flex';
            if (currentCall) { currentCall.close(); currentCall=null; }
            hangupBtn.disabled = true;
            activeCallStatus.textContent = 'No active call';
        }

        async function callUser(targetId) {
            if (!localStream) await initLocalMedia();
            if (currentCall) cleanupCall();
            const call = peer.call(targetId, localStream);
            if (call) {
                setupCallHandlers(call);
                activeCallStatus.textContent = `calling ${targetId.substring(0,6)}...`;
            }
        }

        // ---------- Event listeners ----------
        toggleMicBtn.onclick = () => {
            if (localStream) { const a = localStream.getAudioTracks()[0]; if(a) a.enabled = !a.enabled; isMuted = !a.enabled; updateButtons(); }
        };
        toggleVideoBtn.onclick = () => {
            if (localStream) { const v = localStream.getVideoTracks()[0]; if(v) { v.enabled = !v.enabled; isVideoOff = !v.enabled; localPlaceholder.style.display = v.enabled?'none':'flex'; } else { isVideoOff = false; initLocalMedia(); } updateButtons(); }
        };
        switchCameraBtn.onclick = () => { usingFront = !usingFront; initLocalMedia(); };
        hangupBtn.onclick = cleanupCall;
        document.getElementById('refresh-users').onclick = () => { publishPresence(); renderThumbnails(); };

        // start
        initPeer();

        window.addEventListener('beforeunload', ()=> {
            if (mqttClient) { mqttClient.publish(MQTT_TOPIC, JSON.stringify({type:'leave', peerId})); mqttClient.end(); }
            if (currentCall) currentCall.close();
            if (localStream) localStream.getTracks().forEach(t=>t.stop());
            if (peer) peer.destroy();
        });
    })();
</script>
</body>
</html>

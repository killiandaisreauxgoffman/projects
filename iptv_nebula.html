<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>NEBULA IPTV | 2026 FUTURISTIC STREAM</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #03010a;
            --bg-surface: #0a0718;
            --card-bg: rgba(18, 14, 32, 0.7);
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff00d4;
            --neon-purple: #b100ff;
            --neon-gold: #ffcc00;
            --glass-border: rgba(0, 243, 255, 0.25);
            --text-glow: 0 0 10px rgba(0, 243, 255, 0.5);
            --gradient-edge: linear-gradient(135deg, #00f3ff, #ff00d4, #b100ff);
            --gradient-scan: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.4), transparent);
            --shadow-neon: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-deep);
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* dynamic animated gradient background */
        .cyber-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 20% 30%, rgba(0, 243, 255, 0.08), rgba(255, 0, 212, 0.05), var(--bg-deep));
        }

        .cyber-bg::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(0, 243, 255, 0.02) 40px, rgba(0, 243, 255, 0.05) 80px);
            animation: shiftGrid 20s linear infinite;
        }

        @keyframes shiftGrid {
            0% { transform: translate(0, 0); }
            100% { transform: translate(80px, 80px); }
        }

        /* main app container */
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            backdrop-filter: blur(2px);
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .app.loaded { opacity: 1; }

        /* header with neon morph */
        .header {
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(3, 1, 10, 0.65);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 20;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .logo-icon {
            font-size: 2rem;
            filter: drop-shadow(0 0 8px var(--neon-cyan));
            background: var(--gradient-edge);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo-text {
            font-weight: 800;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #fff, var(--neon-cyan), var(--neon-magenta));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        .year-badge {
            background: rgba(0, 243, 255, 0.15);
            border: 1px solid var(--neon-cyan);
            border-radius: 40px;
            padding: 0.2rem 0.8rem;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 0.8rem;
            box-shadow: 0 0 6px var(--neon-cyan);
        }
        .time-machine {
            font-family: monospace;
            font-weight: 600;
            font-size: 1.3rem;
            letter-spacing: 2px;
            background: linear-gradient(145deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* main layout */
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 0;
        }

        /* ========= SIDEBAR FUTURISTIC ========= */
        .sidebar {
            width: 340px;
            background: rgba(10, 7, 24, 0.7);
            backdrop-filter: blur(16px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            transition: transform 0.4s ease;
            z-index: 15;
        }

        /* WIDGETS with dynamic gradient edges */
        .widget-glow {
            margin: 1rem 1rem 0.5rem 1rem;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 1rem;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .widget-glow::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: var(--gradient-edge);
            z-index: -1;
            border-radius: 22px;
            opacity: 0;
            transition: opacity 0.4s;
        }
        .widget-glow:hover::before {
            opacity: 0.5;
        }
        .widget-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--neon-cyan);
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .search-futuristic {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .search-futuristic input {
            flex: 1;
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--neon-cyan);
            padding: 0.7rem 1rem;
            border-radius: 40px;
            color: white;
            font-weight: 500;
            outline: none;
            transition: all 0.2s;
        }
        .search-futuristic input:focus {
            box-shadow: 0 0 12px var(--neon-cyan);
            border-color: var(--neon-magenta);
        }
        .country-select {
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--neon-purple);
            padding: 0.7rem 1rem;
            border-radius: 40px;
            color: white;
            font-weight: 500;
            cursor: pointer;
        }
        /* category pills */
        .category-cyber {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding: 0.5rem 0;
            scrollbar-width: thin;
        }
        .pill {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(0, 243, 255, 0.4);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }
        .pill.active, .pill:hover {
            background: var(--gradient-edge);
            border-color: transparent;
            color: #03010a;
            box-shadow: 0 0 10px var(--neon-cyan);
        }
        /* channel list dynamic */
        .channel-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem 1rem 1.5rem;
        }
        .channel-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(20, 15, 40, 0.6);
            backdrop-filter: blur(4px);
            margin: 0.6rem 0;
            padding: 0.7rem;
            border-radius: 16px;
            border-left: 3px solid var(--neon-cyan);
            cursor: pointer;
            transition: all 0.2s;
        }
        .channel-card:hover {
            transform: translateX(6px);
            background: rgba(0, 243, 255, 0.1);
            border-left-color: var(--neon-magenta);
            box-shadow: 0 0 12px rgba(0,243,255,0.2);
        }
        .channel-card.active {
            background: linear-gradient(90deg, rgba(0,243,255,0.2), transparent);
            border-left-width: 4px;
        }
        .channel-logo-sm {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            object-fit: cover;
            background: #0a0718;
        }
        .channel-info h4 {
            font-size: 0.9rem;
            font-weight: 600;
        }
        .channel-meta {
            font-size: 0.7rem;
            color: #aaa;
            display: flex;
            gap: 8px;
        }
        .country-flag {
            font-size: 0.7rem;
            background: rgba(0,0,0,0.5);
            padding: 0.1rem 0.4rem;
            border-radius: 12px;
        }

        /* PLAYER AREA with edge gradient widget */
        .player-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #00000055;
            position: relative;
        }
        .glass-player {
            flex: 1;
            margin: 1rem;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,243,255,0.2);
            border: 1px solid rgba(0,243,255,0.4);
            position: relative;
            background: #000;
        }
        #video-player {
            width: 100%;
            height: 100%;
        }
        .nowplaying-bar {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            margin: 0 1rem 1rem 1rem;
            padding: 0.7rem 1.2rem;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 1rem;
            border: 1px solid var(--glass-border);
        }
        .pulse-dot {
            width: 10px;
            height: 10px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px cyan;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.4; transform: scale(0.8);} 100% { opacity: 1; transform: scale(1.2);} }

        /* floating stats widgets */
        .floating-stats {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            padding: 0.5rem 1rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-family: monospace;
            border-left: 3px solid var(--neon-gold);
            z-index: 22;
            pointer-events: none;
        }
        .mobile-toggle {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--gradient-edge);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 30px;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 30;
            box-shadow: 0 0 20px magenta;
        }

        @media (max-width: 780px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                width: 85%;
                transform: translateX(-100%);
                z-index: 100;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .mobile-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .main-layout {
                flex-direction: column;
            }
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0a0718; }
        ::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 10px; }
    </style>
</head>
<body>
<div class="cyber-bg"></div>
<div class="app" id="app">
    <div class="header">
        <div class="logo-area">
            <i class="fas fa-satellite-dish logo-icon"></i>
            <div class="logo-text">NEBULA X<span class="year-badge">2026 EDGE</span></div>
        </div>
        <div class="time-machine" id="glowClock">--:--:--</div>
    </div>

    <div class="main-layout">
        <!-- Sidebar with gradient widgets -->
        <div class="sidebar" id="sidebar">
            <!-- Widget: Dynamic Search + Country filter -->
            <div class="widget-glow">
                <div class="widget-title"><i class="fas fa-search"></i> QUANTUM SEARCH</div>
                <div class="search-futuristic">
                    <input type="text" id="searchName" placeholder="channel name...">
                    <select id="countryFilter" class="country-select">
                        <option value="all">🌍 ALL COUNTRIES</option>
                    </select>
                </div>
            </div>

            <!-- Widget: Categories with morph -->
            <div class="widget-glow">
                <div class="widget-title"><i class="fas fa-folder-open"></i> HYPER-CATEGORIES</div>
                <div class="category-cyber" id="categoriesContainer">
                    <div class="pill active" data-cat="all">⚡ ALL</div>
                    <div class="pill" data-cat="Sports">🏆 SPORTS</div>
                    <div class="pill" data-cat="News">📡 NEWS</div>
                    <div class="pill" data-cat="Entertainment">🎬 ENTERTAIN</div>
                    <div class="pill" data-cat="Music">🎵 MUSIC</div>
                </div>
            </div>

            <!-- Channel list with country detection -->
            <div class="channel-scroll" id="channelListContainer">
                <div style="text-align:center; padding: 2rem;">🌀 loading neural streams...</div>
            </div>
        </div>

        <!-- Player Zone -->
        <div class="player-zone">
            <div class="glass-player">
                <video id="video-player" class="video-js vjs-default-skin" controls playsinline></video>
                <div id="streamLoading" style="display: none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background: rgba(0,0,0,0.7); padding: 1rem; border-radius: 30px;"><i class="fas fa-circle-notch fa-spin"></i> buffering quantum stream</div>
            </div>
            <div class="nowplaying-bar">
                <div class="pulse-dot"></div>
                <span style="font-weight:300;">NOW PLAYING:</span>
                <strong id="currentChannelName">—</strong>
                <span id="currentCountryBadge" style="margin-left:auto; font-size:0.7rem;"></span>
            </div>
        </div>
    </div>
    <div class="floating-stats" id="liveStats">📡 channels: 0 | 🌍 countries: 0</div>
    <button class="mobile-toggle" id="mobileToggleBtn"><i class="fas fa-bars"></i></button>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.10/dist/hls.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>

<script>
    // ------------------- 2026 FUTURISTIC IPTV CORE -------------------
    let player = null;
    let allChannels = [];
    let currentChannel = null;
    let activeCategory = "all";
    let searchQuery = "";
    let selectedCountry = "all";
    let hlsInstance = null;

    // DOM elements
    const channelContainer = document.getElementById("channelListContainer");
    const searchNameInput = document.getElementById("searchName");
    const countrySelect = document.getElementById("countryFilter");
    const categoriesContainerDiv = document.getElementById("categoriesContainer");
    const currentChannelNameSpan = document.getElementById("currentChannelName");
    const currentCountryBadge = document.getElementById("currentCountryBadge");
    const liveStatsSpan = document.getElementById("liveStats");
    const loadingOverlay = document.getElementById("streamLoading");
    const sidebarEl = document.getElementById("sidebar");
    const mobileBtn = document.getElementById("mobileToggleBtn");

    // Helper: extract country from channel name / group or tvg (simulate dynamic detection)
    function extractCountry(channelName, group = "") {
        const countryMap = [
            { name: "USA", keywords: ["us", "usa", "american", "abc", "nbc", "cbs", "fox", "cnn", "espn", "hbo"] },
            { name: "UK", keywords: ["bbc", "itv", "sky news", "uk", "british", "channel 4", "bt sport"] },
            { name: "FRANCE", keywords: ["france", "franc","tf1", "france 2", "m6"] },
            { name: "GERMANY", keywords: ["deutsch", "german", "ard", "zdf", "rtl"] },
            { name: "SPAIN", keywords: ["españa", "spanish", "la liga", "movistar", "antena 3"] },
            { name: "ITALY", keywords: ["italia", "rai", "mediaset", "sky italia"] },
            { name: "INDIA", keywords: ["india", "zeetv", "star plus", "sony tv", "colors"] },
            { name: "RUSSIA", keywords: ["russia", "russian", "ntv", "rtr"] },
            { name: "BRAZIL", keywords: ["brazil", "globo", "record", "band"] },
            { name: "CANADA", keywords: ["canada", "ctv", "cbc", "tsn"] }
        ];
        const text = (channelName + " " + group).toLowerCase();
        for (let c of countryMap) {
            if (c.keywords.some(kw => text.includes(kw))) return c.name;
        }
        return "GLOBAL";
    }

    // fetch M3U from official repo
    async function fetchGlobalPlaylist() {
        try {
            const response = await fetch("https://iptv-org.github.io/iptv/index.m3u");
            if (!response.ok) throw new Error("Playlist fetch error");
            const data = await response.text();
            const lines = data.split("\n");
            const channels = [];
            let index = 1;
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith("#EXTINF")) {
                    const tvgLogoMatch = line.match(/tvg-logo="([^"]*)"/);
                    const groupMatch = line.match(/group-title="([^"]*)"/);
                    const tvgNameMatch = line.match(/tvg-name="([^"]*)"/);
                    let channelName = line.split(",").pop()?.trim() || `Channel ${index}`;
                    let groupTitle = groupMatch ? groupMatch[1] : "General";
                    let logo = tvgLogoMatch ? tvgLogoMatch[1] : `https://ui-avatars.com/api/?name=${encodeURIComponent(channelName.slice(0,2))}&background=0a0718&color=00f3ff&size=44`;
                    if (i + 1 < lines.length) {
                        let streamUrl = lines[i+1].trim();
                        if (streamUrl && !streamUrl.startsWith("#")) {
                            const country = extractCountry(channelName, groupTitle);
                            channels.push({
                                id: `ch_${index}`,
                                number: index,
                                name: channelName,
                                group: groupTitle,
                                logo: logo,
                                stream: streamUrl,
                                country: country
                            });
                            index++;
                            i++;
                        }
                    }
                }
            }
            console.log(`✅ ${channels.length} channels loaded`);
            return channels;
        } catch(e) {
            console.error(e);
            // fallback demo channels for preview
            return [
                { id:"demo1", number:1, name:"SPORTS 4K PREVIEW", group:"Sports", stream:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", country:"USA", logo:"" },
                { id:"demo2", number:2, name:"BBC WORLD NEWS", group:"News", stream:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", country:"UK", logo:"" }
            ];
        }
    }

    // render channels with filters (search, country, category)
    function filterAndRender() {
        let filtered = [...allChannels];
        // search by name
        if (searchQuery.trim() !== "") {
            filtered = filtered.filter(ch => ch.name.toLowerCase().includes(searchQuery.toLowerCase()));
        }
        // country
        if (selectedCountry !== "all") {
            filtered = filtered.filter(ch => ch.country === selectedCountry);
        }
        // category group
        if (activeCategory !== "all") {
            if (activeCategory === "Sports") filtered = filtered.filter(ch => ch.group.toLowerCase().includes("sport"));
            else if (activeCategory === "News") filtered = filtered.filter(ch => ch.group.toLowerCase().includes("news"));
            else if (activeCategory === "Entertainment") filtered = filtered.filter(ch => ch.group.toLowerCase().includes("entertain") || ch.group.toLowerCase().includes("series"));
            else if (activeCategory === "Music") filtered = filtered.filter(ch => ch.group.toLowerCase().includes("music"));
        }
        displayChannels(filtered);
        updateStats();
    }

    function displayChannels(channels) {
        if (!channels.length) {
            channelContainer.innerHTML = `<div style="padding:2rem; text-align:center;">🌀 no channels match<br>adjust filters</div>`;
            return;
        }
        let html = "";
        channels.forEach(ch => {
            const activeClass = (currentChannel && currentChannel.id === ch.id) ? "active" : "";
            html += `
                <div class="channel-card ${activeClass}" data-id="${ch.id}">
                    <img class="channel-logo-sm" src="${ch.logo || 'https://ui-avatars.com/api/?name='+encodeURIComponent(ch.name.slice(0,2))+'&background=0a0718&color=cyan'}" onerror="this.src='https://ui-avatars.com/api/?name=TV&background=0a0718&color=cyan'">
                    <div class="channel-info">
                        <h4>${escapeHtml(ch.name)}</h4>
                        <div class="channel-meta">
                            <span>${ch.group}</span>
                            <span class="country-flag"><i class="fas fa-globe"></i> ${ch.country}</span>
                        </div>
                    </div>
                </div>
            `;
        });
        channelContainer.innerHTML = html;
        // attach events
        document.querySelectorAll(".channel-card").forEach(card => {
            const id = card.dataset.id;
            card.addEventListener("click", () => {
                const targetChannel = allChannels.find(c => c.id === id);
                if (targetChannel) playChannel(targetChannel);
                if (window.innerWidth <= 780) sidebarEl.classList.remove("open");
            });
        });
    }

    function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    function updateStats() {
        let uniqueCountries = new Set(allChannels.map(c => c.country));
        liveStatsSpan.innerHTML = `📡 channels: ${allChannels.length} | 🌍 countries: ${uniqueCountries.size}`;
        // populate country dropdown dynamically
        if (countrySelect.children.length <= 1) {
            const countries = [...new Set(allChannels.map(c => c.country))].sort();
            countries.forEach(c => {
                let opt = document.createElement("option");
                opt.value = c;
                opt.textContent = `🌍 ${c}`;
                countrySelect.appendChild(opt);
            });
        }
    }

    // advanced player with HLS support
    async function playChannel(channel) {
        if (!channel || !channel.stream) return;
        if (currentChannel && currentChannel.id === channel.id) return;
        currentChannel = channel;
        currentChannelNameSpan.innerText = channel.name;
        currentCountryBadge.innerHTML = `<i class="fas fa-map-marker-alt"></i> ${channel.country}`;
        if (loadingOverlay) loadingOverlay.style.display = "flex";
        // destroy previous
        if (player) { player.dispose(); player = null; }
        if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
        const videoEl = document.getElementById("video-player");
        const streamUrl = channel.stream;
        const isM3U8 = streamUrl.includes(".m3u8") || streamUrl.includes("m3u8");
        try {
            if (isM3U8 && Hls.isSupported()) {
                hlsInstance = new Hls({ maxBufferLength: 30, enableWorker: true });
                hlsInstance.loadSource(streamUrl);
                hlsInstance.attachMedia(videoEl);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    videoEl.play().catch(e => { videoEl.muted = true; videoEl.play(); });
                    if (loadingOverlay) loadingOverlay.style.display = "none";
                });
                hlsInstance.on(Hls.Events.ERROR, () => { if(loadingOverlay) loadingOverlay.style.display = "none"; });
            } else if (videoEl.canPlayType("application/vnd.apple.mpegurl")) {
                videoEl.src = streamUrl;
                videoEl.play().catch(e=>{videoEl.muted=true; videoEl.play();});
                if(loadingOverlay) loadingOverlay.style.display = "none";
            } else {
                player = videojs('video-player', { controls: true, autoplay: true, techOrder: ['html5'] });
                player.src({ src: streamUrl, type: "application/x-mpegURL" });
                player.ready(() => { player.play().catch(()=>{ player.muted(true); player.play();}); if(loadingOverlay) loadingOverlay.style.display = "none"; });
                player.on('error', ()=> { if(loadingOverlay) loadingOverlay.style.display = "none"; });
            }
            setTimeout(() => { if(loadingOverlay) loadingOverlay.style.display = "none"; }, 3000);
        } catch(err) { console.error(err); if(loadingOverlay) loadingOverlay.style.display = "none"; }
        // highlight active channel
        document.querySelectorAll(".channel-card").forEach(card => card.classList.remove("active"));
        const activeCard = document.querySelector(`.channel-card[data-id="${channel.id}"]`);
        if(activeCard) activeCard.classList.add("active");
    }

    // setup listeners & categories
    function setupFilters() {
        searchNameInput.addEventListener("input", (e) => { searchQuery = e.target.value; filterAndRender(); });
        countrySelect.addEventListener("change", (e) => { selectedCountry = e.target.value; filterAndRender(); });
        const pills = document.querySelectorAll(".pill");
        pills.forEach(pill => {
            pill.addEventListener("click", () => {
                pills.forEach(p => p.classList.remove("active"));
                pill.classList.add("active");
                activeCategory = pill.dataset.cat;
                filterAndRender();
            });
        });
    }

    // clock update
    function updateDigitalClock() {
        const now = new Date();
        document.getElementById("glowClock").innerHTML = now.toLocaleTimeString('en-US', { hour12: false });
    }
    setInterval(updateDigitalClock, 1000);
    updateDigitalClock();

    // mobile menu
    mobileBtn.addEventListener("click", () => sidebarEl.classList.toggle("open"));
    document.addEventListener("click", (e) => {
        if(window.innerWidth <= 780 && !sidebarEl.contains(e.target) && e.target !== mobileBtn && !mobileBtn.contains(e.target)) {
            sidebarEl.classList.remove("open");
        }
    });

    // INIT
    async function init() {
        const loadingBar = document.createElement("div");
        allChannels = await fetchGlobalPlaylist();
        setupFilters();
        filterAndRender();
        if (allChannels.length) {
            let sportsChannel = allChannels.find(c => c.group.toLowerCase().includes("sport"));
            playChannel(sportsChannel || allChannels[0]);
        }
        document.getElementById("app").classList.add("loaded");
    }
    init();
</script>
</body>
</html>
